name: Deploy to server
on: push
jobs:
  first_jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hola mundo
        run: echo "Hola mundo"
  second_jobs:
    if: ${{ github.ref == 'refs/heads/main'}}
    needs:
      - first_jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hola mundo segundo
        if: false
        run: echo "nuevo saludo"
