name: Deploy to server
on: push
jobs:
  first_jobs:
    runs-on: ubuntu-latest
    env:
      NAME: pruebaVariable
    steps:
      - name: working dir
        run: echo $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          hola: 12

      - name: working dir after action
        run: ls -al
  second_jobs:
    if: ${{ github.ref == 'refs/heads/main'}}
    needs:
      - first_jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hola mundo segundo
        if: false
        run: echo "nuevo saludo"
